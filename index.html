<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-sketch</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="roof-up-shadow"></div>
        <div class="roof">Etch-a-Sketch</div>
        <div class="roof-down-shadow"></div>
        <div class="upper-wall">
            <button class="new-field">*** NEW FIELD ***</button>
        </div>
        <div class="porch-roof"></div>
        <div class="porch-roof-shadow"></div>
        <div class="bottom-wall">
            <button class="eraser">ERASER</button>
            <button class="clear">CLEAR FIELD</button>
            <button class="rainbow">RAINBOW</button>
        </div>
        <div class="ground-up"></div>
        <div class="ground-down"></div>
        <div class="railing-container">
            <div class="left-railings">
                <div class="small"></div>
                <div class="medium"></div>
                <div class="big"></div>
                <div class="cross"></div>
            </div>
            <div class="steps">
                <div class="step-up"></div>
                <div class="step-down"></div>
            </div>
            <div class="right-railings">
                <div class="cross"></div>
                <div class="big"></div>
                <div class="medium"></div>
                <div class="small"></div>
            </div>
        </div>
        <div class="field-container"> 
            <div class="field-text">
                <div class="field-text-left">[⚘] • [⚘] • [⚘]</div>
                <div class="field-text-right">field size: 100x100</div>
            </div>
            <div class="field"></div>
        </div>
        <div class="footer">© rickytiky  for the Odin Project  2026</div>
    </div>
</body>
</html>
